name: Build Ender Blade

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - name: Prepare dist
        run: |
          mkdir -p dist release
          cp build/libs/enderblade-*.jar dist/ || true
          rm -f dist/*-sources.jar dist/*-javadoc.jar
          cp dist/*.jar release/ 2>/dev/null || true
          ls -lah build/libs dist release || true
      - uses: actions/upload-artifact@v4
        with:
          name: enderblade-mod
          path: dist/*.jar
          if-no-files-found: error
      - name: Commit JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/*.jar 2>/dev/null || true
          if git diff --cached --quiet; then echo "no jar change"; else
            git commit -m "ci: add built enderblade mod JAR"
            git push origin HEAD
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="enderblade-1.0.0"
          gh release delete "$TAG" -y 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" dist/*.jar \
            --title "Ender Blade 1.0.0" \
            --notes "Đoản Kiếm Hư Không — full NeoForge 1.21.1 weapon mod." \
            --latest
