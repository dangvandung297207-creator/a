name: Build Ender Blade

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          # Extract Java errors for visibility
          echo "## Compile errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|\.java:[0-9]+:|FAILED" build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          # Also push errors as a gist-like file into the repo on failure
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p build-errors
            grep -E "error:|warning:.*\.java|\.java:[0-9]+:" build.log > build-errors/errors.txt || cp build.log build-errors/errors.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build-errors/errors.txt
            git commit -m "ci: compile errors" || true
            git push origin HEAD || true
            exit $STATUS
          fi

      - name: Prepare dist
        run: |
          mkdir -p dist release
          cp build/libs/enderblade-*.jar dist/
          rm -f dist/*-sources.jar dist/*-javadoc.jar
          cp dist/*.jar release/
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: enderblade-mod
          path: dist/*.jar

      - name: Commit JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/*.jar
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "ci: add built enderblade mod JAR"
            git push origin HEAD
          fi

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="enderblade-1.0.0"
          gh release delete "$TAG" -y 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" dist/*.jar \
            --title "Ender Blade 1.0.0" \
            --notes "Đoản Kiếm Hư Không — NeoForge 1.21.1 full weapon mod." \
            --latest
