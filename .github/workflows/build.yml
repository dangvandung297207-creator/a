name: Build Ender Blade

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: enderblade-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload to release assets folder
        run: |
          mkdir -p dist
          cp build/libs/enderblade-*.jar dist/ || cp build/libs/*.jar dist/
          ls -lh dist/
