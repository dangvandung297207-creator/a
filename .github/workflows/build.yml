name: Build

on:
  push:
    branches: [arena/01a0a149-a]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.14.2
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.14.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.14.2/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: true-metallurgy-jar
          path: build/libs/*.jar
          if-no-files-found: error
