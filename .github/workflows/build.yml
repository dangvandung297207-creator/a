name: Build

on:
  push:
    branches: [arena/01a0a149-a]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.14.2
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.14.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.14.2/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: |
          gradle build --no-daemon 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Annotate errors
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -A6 "What went wrong:" build.log | head -20 | while IFS= read -r line; do
            echo "::error::gradle: $line"
          done
          grep -E "FAILED$" build.log | head -10 | while IFS= read -r line; do
            echo "::error::task: $line"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: true-metallurgy-jar
          path: build/libs/*.jar
          if-no-files-found: error
