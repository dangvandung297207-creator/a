modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EnderBlade Dev"
description='''
Đoản Kiếm Hư Không (Ender Blade) — a legendary dimensional assassin weapon.
Cuts, marks, displaces and teleports through space itself.
Custom 3D voxel model, combat animations, Ender Echo, Void Anchor, Paradox Step and End Dimension ultimate.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
